<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 266" width="860" height="266" role="img" aria-label="검증할 건수는 곱셈으로 늘어납니다">
  <rect width="860" height="266" fill="#fbfbf9"/>
  <text x="30" y="42" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1a1a1a">검증할 건수는 곱셈으로 늘어납니다</text>
  <line x1="30" y1="56" x2="830" y2="56" stroke="#1a1a1a" stroke-width="2"/>

  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">
    <rect x="30" y="90" width="140" height="58" fill="#fff" stroke="#666"/>
    <text x="100" y="115" text-anchor="middle" font-size="12" fill="#666">프로젝트</text>
    <text x="100" y="136" text-anchor="middle" font-size="15" font-weight="700">N개</text>

    <text x="185" y="126" text-anchor="middle" font-size="20" fill="#999">×</text>

    <rect x="200" y="90" width="140" height="58" fill="#fff" stroke="#666"/>
    <text x="270" y="115" text-anchor="middle" font-size="12" fill="#666">도메인</text>
    <text x="270" y="136" text-anchor="middle" font-size="15" font-weight="700">규정 · 매뉴얼</text>

    <text x="355" y="126" text-anchor="middle" font-size="20" fill="#999">×</text>

    <rect x="370" y="90" width="140" height="58" fill="#fff" stroke="#666"/>
    <text x="440" y="115" text-anchor="middle" font-size="12" fill="#666">평가셋</text>
    <text x="440" y="136" text-anchor="middle" font-size="15" font-weight="700">Q&amp;A 수백 건</text>

    <text x="525" y="126" text-anchor="middle" font-size="20" fill="#999">×</text>

    <rect x="540" y="90" width="140" height="58" fill="#fff" stroke="#666"/>
    <text x="610" y="115" text-anchor="middle" font-size="12" fill="#666">개정 이력</text>
    <text x="610" y="136" text-anchor="middle" font-size="15" font-weight="700">정답이 바뀜</text>

    <text x="700" y="126" font-size="20" fill="#999">=</text>

    <rect x="722" y="82" width="108" height="74" fill="#1a1a1a"/>
    <text x="776" y="108" text-anchor="middle" font-size="12" fill="#bbb">검증 건수</text>
    <text x="776" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">계속 증가</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="30" y="196" width="800" height="52" fill="#fff" stroke="#666"/>
    <text x="46" y="217" font-size="12" fill="#666">투입 가능 인원</text>
    <text x="46" y="239" font-size="15" font-weight="700" fill="#1a1a1a">정해져 있습니다</text>
    <line x1="200" y1="222" x2="810" y2="222" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="1 0"/>
    <text x="810" y="216" text-anchor="end" font-size="11" fill="#999">늘지 않습니다</text>
  </g>

</svg>
